name: Basic Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check backend tests

      - name: Verify required docs exist
        run: |
          test -f README.md
          test -f SYSTEM_OVERVIEW.md
          test -f docs/DEVELOPMENT.md
          test -f docs/PRODUCT_REQUIREMENTS.md
          test -f docs/API_REFERENCE.md
